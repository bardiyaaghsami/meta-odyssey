#@TYPE: Machine
#@NAME: odyssey-stm32mp135d
#@DESCRIPTION: Seeed Studio ODYSSEY STM32MP135D, OP-TEE boot, SD card
#@NEEDED_BSPLAYERS: layers/meta-openembedded/meta-oe layers/meta-openembedded/meta-python

# STM32MP135D, one Cortex-A7. Reuse the STM32MP13 machine family.
# Do not inherit the STM32MP135F-DK device tree or its CRYP/SAES nodes.
MACHINEOVERRIDES =. "stm32mp1common:stm32mp13common:"

include conf/machine/include/st-machine-common-stm32mp.inc
include conf/machine/include/st-machine-providers-stm32mp.inc

DEFAULTTUNE = "cortexa7thf-neon-vfpv4"
include conf/machine/include/arm/armv7a/tune-cortexa7.inc

# Boot ROM -> TF-A -> OP-TEE -> U-Boot. SD is the Milestone 3A boot device.
# eMMC is described in the device tree. Booting from eMMC is a jumper variant
# and is not a second flash layout in this milestone.
BOOTSCHEME_LABELS += "optee"
BOOTDEVICE_LABELS += "sdcard"

# Names the external device trees and the generated SD FlashLayout.
STM32MP_DT_FILES_SDCARD += "stm32mp135d-odyssey"

MACHINE_FEATURES += "watchdog"
MACHINE_FEATURES += "nosmp"
MACHINE_FEATURES += "usbg0"

# OP-TEE TA SDK export follows this board device tree, not the Discovery kit.
ST_OPTEE_EXPORT_TA_REF_BOARD:stm32mp1common = "stm32mp135d-odyssey.dts"
